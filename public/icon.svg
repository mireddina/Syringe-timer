<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Syringe barrel rotated -45deg centered -->
  <g transform="translate(256 256) rotate(-45)">
    <!-- Plunger handle & rod -->
    <rect x="-152" y="-32" width="18" height="64" rx="9" fill="#ffffff" />
    <rect x="-134" y="-9" width="46" height="18" rx="4" fill="#dbeafe" />
    <!-- Outer syringe body -->
    <rect x="-88" y="-44" width="188" height="88" rx="14" fill="#ffffff" />
    <!-- Fluid level inside barrel -->
    <rect x="-78" y="-34" width="114" height="68" rx="8" fill="#60a5fa" opacity="0.9" />
    <!-- Graduation ticks -->
    <rect x="-48" y="-34" width="6" height="22" rx="3" fill="#1e40af" />
    <rect x="-18" y="-34" width="6" height="16" rx="3" fill="#1e40af" />
    <rect x="12" y="-34" width="6" height="22" rx="3" fill="#1e40af" />
    <rect x="42" y="-34" width="6" height="16" rx="3" fill="#1e40af" />
    <rect x="72" y="-34" width="6" height="22" rx="3" fill="#1e40af" />
    <!-- Collar flange -->
    <rect x="-96" y="-58" width="16" height="116" rx="8" fill="#eff6ff" />
    <!-- Tip & Needle -->
    <rect x="100" y="-16" width="24" height="32" rx="6" fill="#dbeafe" />
    <rect x="124" y="-5" width="44" height="10" rx="5" fill="#ffffff" />
  </g>
</svg>
